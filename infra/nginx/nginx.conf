user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off; # Скрытие версии веб-сервера от сканеров
    client_max_body_size 100M; # Разрешить загрузку аудиозаписей совещаний до 100 МБ

    # =========================================================================
    # ЗАЩИТА ОТ СКАНЕРОВ ПОРТОВ И УЯЗВИМОСТЕЙ (ANTI-SCANNER MAP)
    # =========================================================================
    map $http_user_agent $is_scanner_bot {
        default 0;
        ~*(nmap|masscan|nikto|sqlmap|zgrab|shodan|censys|gobuster|dirbuster|wprecon) 1;
    }

    # =========================================================================
    # RATE LIMITING ZONES & СГЛАЖИВАНИЕ ПИКОВЫХ НАГРУЗОК
    # =========================================================================
    # Зона для вебхуков Telegram (сглаживание пачек сообщений)
    limit_req_zone $binary_remote_addr zone=telegram_webhook_zone:10m rate=20r/s;

    # Зона для общего API шлюза
    limit_req_zone $binary_remote_addr zone=api_general_zone:10m rate=15r/s;

    # Зона для n8n вебхуков
    limit_req_zone $binary_remote_addr zone=n8n_zone:10m rate=25r/s;

    # =========================================================================
    # UPSTREAM CLUSTERS (ВНУТРЕННИЙ ЗАЩИЩЕННЫЙ ПЕРИМЕТР)
    # =========================================================================
    upstream ai_gateway_upstream {
        server ai-gateway:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream n8n_upstream {
        server n8n:5678 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream langfuse_upstream {
        server langfuse-web:3000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # 1. Мгновенный сброс соединения (444) для известных сканеров портов
        if ($is_scanner_bot) {
            return 444;
        }

        # 2. Ловушки honeypot: блокировка поиска закрытых файлов (.env, .git, wp-, phpmyadmin, actuator и т.д.)
        location ~* (\.env|\.git|wp-|phpmyadmin|actuator|cgi-bin|setup\.cgi|swagger|console|shell) {
            access_log /var/log/nginx/security_attacks.log;
            return 444;
        }

        # 3. Полный запрет прямого внешнего обращения к путям MCP инструментов
        location ~* ^/(tools|mcp|employee-reader|1c|bitrix24|calendar) {
            default_type application/json;
            return 403 '{"error":"Forbidden","message":"Прямой доступ к MCP-серверам из публичной сети запрещен. Используйте авторизованную точку входа."}';
        }

        # 4. Проверка работоспособности самого Nginx
        location /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"nginx-load-balancer"}';
        }

        # ---------------------------------------------------------------------
        # 5. Telegram Webhook: Сглаживание пиков с очередью burst=40
        # ---------------------------------------------------------------------
        location /api/telegram/webhook {
            limit_req zone=telegram_webhook_zone burst=40 delay=10;
            limit_req_status 429;

            proxy_pass http://ai_gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ---------------------------------------------------------------------
        # 6. Общий REST API шлюза (RAG, встречи, экспорт протоколов)
        # ---------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_general_zone burst=25 nodelay;
            limit_req_status 429;

            proxy_pass http://ai_gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Health endpoint шлюза
        location /health {
            proxy_pass http://ai_gateway_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ---------------------------------------------------------------------
        # 7. Вебхуки оркестратора n8n
        # ---------------------------------------------------------------------
        location /webhook/ {
            limit_req zone=n8n_zone burst=30 delay=5;

            proxy_pass http://n8n_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ---------------------------------------------------------------------
        # 8. Web Chat UI (Fotoprint Copilot + NVIDIA Nemotron)
        # ---------------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
